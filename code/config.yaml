# Evolutionary Radio — v0.2.0 configuration
# All paths can be absolute or start with ~. Ports follow OmniSenter convention.

brain:
  # OmniStep 6B — text LLM, OpenAI-format API (llama-server /v1/chat/completions)
  url: http://localhost:11450
  model: omnisenter-6b
  timeout_sec: 30
  # How to render a "vibe" string into a fully-formed ACE-Step tag string
  # (the prompt template is in prompt_template.py)
  system_prompt: |
    You are the brain of an infinite generative music radio. The user gives you
    a vibe (a short mood description). Your job is to produce a single
    ACE-Step tag string (a comma-separated list of style/mood tags such as
    "lofi, chill, 80bpm, warm pads, dusty drums, vinyl hiss") that will be
    fed to the ACE-Step v1.5 voice synthesizer. Keep it under 200 characters.
    Output ONLY the tag string, no commentary.

voice:
  # ACE-Step v1.5 SFT 2B — DiT decoder, audio synthesis
  url: http://localhost:7860
  default_model: ace-step-v1.5-sft-2b
  # ACE-Step typical params (see acestep_client.py)
  duration_sec: 60
  # Generations are slow; allow generous timeouts
  poll_interval_sec: 2
  timeout_sec: 600
  # If voice is not up, the queue fill loop will retry every `retry_sec`
  retry_sec: 10

queue:
  # asyncio.Queue — bounded so we never burst past the player's needs
  maxsize: 5
  # Sleep between fill checks (seconds)
  fill_sleep_sec: 5
  # Skip-rate threshold below which the queue fill is considered "healthy"
  target_depth: 3

player:
  # mpv IPC socket — created on start, unlinked on stop
  socket_dir: /tmp
  # Initial volume (0-100)
  volume: 70
  # mpv binary
  binary: mpv
  # Default mpv args (audio-only, no terminal, quiet)
  extra_args:
    - "--no-video"
    - "--no-terminal"
    - "--quiet"
    - "--audio-display=no"
    - "--idle=yes"

gepa:
  # Loop 3: GEPA prompt evolution — STUB in v0.2.0
  # Cadence in seconds (60 = every minute in the stub; real cadence is per-skill spec)
  cadence_sec: 60
  population_size: 8
  # Minimum generations before GEPA is allowed to run
  min_gens_before_evolve: 5

darwin:
  # Loop 4: Darwin weight evolution — STUB in v0.2.0
  # How often to "tick" in the stub (hours)
  cadence_hours: 24
  # For testing: if true, tick every 60s instead of every cadence_hours
  fast_stub: false

state:
  # Where the running radio writes its current state (queue depth, last tracks, etc.)
  # CLI commands (`status`, `skip`) read from here.
  file: ~/.local/share/evolutionary-radio/state.json
  pid_file: ~/.local/share/evolutionary-radio/radio.pid
  # How often the running radio refreshes the state file
  refresh_sec: 2

log:
  file: ~/projects/AI-ML/evolutionary-radio/radio.log
  level: INFO

skip_log: ~/music/skip_log.jsonl
